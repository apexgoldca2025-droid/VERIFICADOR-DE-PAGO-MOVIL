<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-DATOS Y PAGO-</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen py-8 px-4 flex flex-col items-center justify-center text-slate-100">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/60 overflow-hidden p-6 md:p-8">
        
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-amber-400 tracking-wider uppercase mb-1">-DATOS Y PAGO-</h1>
            <p class="text-xs text-slate-400">Verifica tu transferencia o pago móvil de forma rápida</p>
        </div>

        <!-- Cuadro Elegante de Datos Bancarios (Negro y Amarillo) - Versión Compacta -->
        <div class="bg-black border-2 border-amber-400/80 rounded-xl p-3.5 mb-6 shadow-[0_0_15px_rgba(251,191,36,0.15)] relative">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] uppercase font-bold tracking-wider bg-amber-400 text-black px-2 py-0.5 rounded-full">Datos de Pago Móvil</span>
                <button onclick="copiarDatos()" id="btnCopiar" class="text-amber-400 hover:text-black hover:bg-amber-400 transition-all text-xs font-semibold px-2 py-1 rounded border border-amber-400 flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-regular fa-copy"></i> <span id="textoCopiar">Copiar Datos</span>
                </button>
            </div>
            <div id="datosBancariosTexto" class="space-y-1 text-xs text-slate-200">
                <p><span class="font-semibold text-amber-400">Banco:</span> Banco Venezuela (0102)</p>
                <p><span class="font-semibold text-amber-400">Cédula/RIF:</span> V-29967119</p>
                <p><span class="font-semibold text-amber-400">Teléfono:</span> 04126012186</p>
            </div>
        </div>

        <!-- Formulario -->
        <form id="pagoForm" onsubmit="enviarWhatsApp(event)" class="space-y-4">
            
            <!-- Nombre y Apellido -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Nombre y Apellido del Titular</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" 
                        class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all">
                </div>
            </div>

            <!-- Cédula o RIF -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Cédula o RIF</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-id-card text-xs"></i>
                    </span>
                    <input type="text" id="cedula" required placeholder="Ej. V-12345678" 
                        class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all">
                </div>
            </div>

            <!-- Últimos 4 dígitos de la referencia -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Últimos 4 Números de la Referencia</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-hashtag text-xs"></i>
                    </span>
                    <input type="text" id="referencia" required maxlength="4" pattern="\d{4}" placeholder="Ej. 4589" 
                        class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all tracking-widest font-mono">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">Introduce exactamente los últimos 4 dígitos del pago.</p>
            </div>

            <!-- Adjuntar Capture -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Adjuntar Comprobante (Capture)</label>
                <div class="flex items-center justify-center w-full">
                    <label id="dropzone" class="flex flex-col items-center justify-center w-full h-24 border-2 border-slate-700 border-dashed rounded-lg cursor-pointer bg-slate-900 hover:bg-slate-800 transition-all">
                        <div id="uploadContent" class="flex flex-col items-center justify-center pt-3 pb-3 px-2 text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-amber-400 text-lg mb-1"></i>
                            <p class="text-xs text-slate-300"><span class="font-semibold text-amber-400">Haz clic para subir</span> o arrastra tu imagen</p>
                            <p class="text-[10px] text-slate-500">PNG, JPG o JPEG</p>
                        </div>
                        <input type="file" id="capture" accept="image/*" class="hidden" onchange="previewImage(event)" />
                    </label>
                </div>
            </div>

            <!-- Botón Enviar WhatsApp (Negro con letras amarillas) -->
            <button type="submit" class="w-full mt-2 bg-black border-2 border-amber-400 text-amber-400 font-bold py-3 px-4 rounded-xl hover:bg-amber-400 hover:text-black transition-all duration-200 flex items-center justify-center gap-2 text-sm cursor-pointer shadow-lg">
                <i class="fa-brands fa-whatsapp text-lg"></i> Enviar Verificación por WhatsApp
            </button>
        </form>
    </div>

    <footer class="mt-6 text-center text-xs text-slate-500">
        &copy; 2026 - Todos los derechos reservados
    </footer>

    <!-- Scripts de Interacción -->
    <script>
        // Función para copiar los datos bancarios
        function copiarDatos() {
            const texto = "Banco Venezuela (0102)\nCédula/RIF: 29967119\nTeléfono: 04126012186";
            navigator.clipboard.writeText(texto).then(() => {
                const btn = document.getElementById('textoCopiar');
                btn.textContent = "¡Copiado!";
                setTimeout(() => {
                    btn.textContent = "Copiar Datos";
                }, 2000);
            });
        }

        // Vista previa del archivo cargado
        function previewImage(event) {
            const file = event.target.files[0];
            const uploadContent = document.getElementById('uploadContent');
            if (file) {
                uploadContent.innerHTML = `
                    <i class="fa-solid fa-check-circle text-emerald-400 text-lg mb-1"></i>
                    <p class="text-xs font-medium text-emerald-300 truncate max-w-[240px]">${file.name}</p>
                    <p class="text-[10px] text-slate-400">Archivo listo para enviar</p>
                `;
            }
        }

        // Envío directo a WhatsApp
        function enviarWhatsApp(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const cedula = document.getElementById('cedula').value;
            const referencia = document.getElementById('referencia').value;
            const fileInput = document.getElementById('capture');

            // Armar mensaje
            let mensaje = `*COMPROBANTE DE PAGO MÓVIL*\n\n`;
            mensaje += `👤 *Titular:* ${nombre}\n`;
            mensaje += `🆔 *Cédula/RIF:* ${cedula}\n`;
            mensaje += `🔢 *Ref (Últimos 4):* ${referencia}\n`;
            
            if (fileInput.files.length > 0) {
                mensaje += `📎 *(Comprobante adjuntado en el formulario)*\n`;
            }

            const telefonoDestino = "584126012186";
            const url = `https://wa.me/${telefonoDestino}?text=${encodeURIComponent(mensaje)}`;

            window.open(url, '_blank');
        }
    </script>
</body>
</html>
